apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rafael-cordones-me
  namespace: rafael-cordones-me
  labels:
    app.kubernetes.io/name: rafael-cordones-me
  annotations:
    # cert-manager issues + renews the TLS cert via the LE prod
    # ClusterIssuer (DNS-01, Hetzner webhook), covering both hosts below
    # as SANs on a single cert. ExternalDNS creates the A record for the
    # cloudlab.casadelhuerto.net host (its domainFilter); the
    # rafael.cordones.me host is outside that filter, so its A record is
    # managed by Terraform in the infra repo (envs/dns/cordones.me.tf) and
    # ExternalDNS leaves it alone.
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: rafael-cordones-me.cloudlab.casadelhuerto.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rafael-cordones-me
                port:
                  name: http
    - host: rafael.cordones.me
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rafael-cordones-me
                port:
                  name: http
  tls:
    - hosts:
        - rafael-cordones-me.cloudlab.casadelhuerto.net
        - rafael.cordones.me
      secretName: rafael-cordones-me-tls
