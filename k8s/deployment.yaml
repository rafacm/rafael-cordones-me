# The image tag is rewritten on every push to main by
# .github/workflows/deploy.yml (companion infra issue). Argo CD then
# sees a real manifest diff and rolls out. Until that CI step lands,
# the tag stays as the literal `PLACEHOLDER` and the first manual
# bump unblocks the first deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rafael-cordones-me
  namespace: rafael-cordones-me
  labels:
    app.kubernetes.io/name: rafael-cordones-me
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: rafael-cordones-me
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rafael-cordones-me
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rafael-cordones-me
          image: ghcr.io/rafacm/rafael-cordones-me:live-sha-1524a7416f7258ee2092b42e89f295250a52c45b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # nginx.conf exposes /healthz on :8080 for probes.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # nginx-unprivileged writes a pid file and uses /tmp for
          # proxy buffers, etc. Mount tmpfs volumes so the root
          # filesystem can stay read-only.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
