# Serves the static Astro build. Paired with the nginx-unprivileged
# image, which runs as non-root and listens on :8080.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;

    # Astro builds directory-style URLs (/posts/slug/ -> .../index.html).
    index index.html;

    # Emit RELATIVE redirects. nginx terminates plain HTTP on :8080 inside
    # the pod; TLS is terminated upstream by Traefik on :443. With nginx's
    # default `absolute_redirect on`, the automatic trailing-slash redirect
    # for a directory (e.g. /posts -> /posts/) is built as an absolute URL
    # using nginx's own scheme+port, producing
    # `http://<host>:8080/posts/` — wrong scheme AND wrong port, so the
    # link breaks. A relative `Location: /posts/` lets the browser resolve
    # it against the real origin (https://<host>/), fixing both at once.
    absolute_redirect off;

    # Liveness/readiness endpoint for Kubernetes probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Hashed/static assets are immutable — cache them hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Pagefind search index and other assets: cache, but revalidate.
    location ~* \.(?:css|js|woff2?|png|jpe?g|gif|svg|webp|avif|ico|json)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # HTML pages: always revalidate so deploys are picked up immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro emits a static 404 page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    gzip            on;
    gzip_vary       on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain text/css application/javascript application/json
        image/svg+xml application/xml application/rss+xml;
}
