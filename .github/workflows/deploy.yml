# Builds and publishes the site's container image to GHCR, then (on main)
# bumps the image tag in this repo's own k8s/ manifests so Argo CD rolls
# it out.
#
# Per-trigger tags produced by the image job:
#   main  -> live-sha-<sha>  + live
#   stage -> stage-sha-<sha> + stage
#   PR    -> pr-<n>-sha-<sha> + pr-<n> (manual deploy only)
#
# The GitOps loop closes here: on push to main the bump-k8s-deployment-image job
# rewrites k8s/deployment.yaml to the new live-sha-<sha> tag and pushes
# it back; Argo CD (auto-syncs every 60s) reconciles it into the cluster.
# Namespaces and other deploy-time choices live in the k8s/ manifests,
# not in this workflow. See rafacm/infra#22 for the GitOps design.
#
# Action pinning policy
# ---------------------
# Third-party actions are pinned to a full-length commit SHA, not a
# version tag. Git tags are mutable and can be repointed at malicious
# code by a compromised upstream (e.g. the tj-actions/changed-files
# incident, March 2025); a commit SHA is immutable. The trailing
# `# vX.Y.Z` comment preserves readability, and Dependabot updates the
# SHA and the comment together.
#
# Reference: GitHub Actions security hardening guide,
# "Using third-party actions":
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

name: build-and-push

on:
  push:
    branches: [main, stage]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Type-checking runs in parallel with the image build instead of inside
  # the Dockerfile. It still gates the PR (it's a separate required check),
  # but it doesn't add to the image's critical path. Saves ~8s on every
  # image build and also surfaces TS errors as a distinct status.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Map the trigger to an environment + tag prefix in ONE place.
      #   main  -> live   stage -> stage   PR -> pr-<number>
      - name: Resolve deploy target
        id: target
        run: |
          case "${{ github.ref }}" in
            refs/heads/main)  env=live  ;;
            refs/heads/stage) env=stage ;;
            *)                env=pr-${{ github.event.number }} ;;
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable per-commit tag + a moving alias, both prefixed by the target.
      #   e.g. live-sha-<sha> + live   |   pr-42-sha-<sha> + pr-42
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=${{ steps.target.outputs.env }}-sha-
            type=raw,value=${{ steps.target.outputs.env }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min exports only the final image's layers (smaller and
          # faster than mode=max). When the source hasn't changed, the
          # whole RUN-build layer hits and the build is near-instant.
          # When source changes, the build re-runs from scratch — we
          # don't try to persist intra-build caches across runs, since
          # doing so reliably requires actions/cache + buildkit-cache-
          # dance, which is more moving parts than this project warrants.
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true

  # Closes the GitOps loop: rewrite k8s/deployment.yaml to the freshly
  # pushed live-sha-<sha> tag and push it back to main. Argo CD then sees
  # a real manifest diff and rolls out. Only runs for pushes to main.
  bump-k8s-deployment-image:
    needs: image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the bump commit
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        # GITHUB_TOKEN is fine while main is unprotected, and its pushes
        # deliberately do NOT trigger another workflow run — so the loop is
        # broken even without [skip ci]. When branch protection lands on
        # main, swap this for a fine-grained PAT (Contents: write, added as
        # a bypass actor): token: ${{ secrets.BUMP_PAT }}

      - name: Install yq
        run: sudo snap install yq

      - name: Compute the new tag
        id: tag
        # Matches the image job's `type=sha,format=long,prefix=live-sha-`.
        run: echo "tag=live-sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Rewrite k8s/deployment.yaml
        run: |
          yq -i '
            (.spec.template.spec.containers[]
              | select(.name == "rafael-cordones-me")
              | .image
            ) = "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
          ' k8s/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "No change to commit"; exit 0
          fi
          git add k8s/deployment.yaml
          git commit -m "ci: bump rafael-cordones-me image to ${{ steps.tag.outputs.tag }} [skip ci]"
          git push origin HEAD:main
