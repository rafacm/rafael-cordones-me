# Builds and publishes the site's container image to GHCR.
#
# This workflow only builds and pushes images. Deployment to the
# Kubernetes cluster is handled by GitOps (ArgoCD) in the separate
# cluster-config repository, which tracks the tags produced here:
#   main  -> live-sha-<sha>  + live   (namespace: live)
#   stage -> stage-sha-<sha> + stage  (namespace: stage)
#   PR    -> pr-<n>-sha-<sha> + pr-<n> (manual deploy only)
#
# Action pinning policy
# ---------------------
# Third-party actions are pinned to a full-length commit SHA, not a
# version tag. Git tags are mutable and can be repointed at malicious
# code by a compromised upstream (e.g. the tj-actions/changed-files
# incident, March 2025); a commit SHA is immutable. The trailing
# `# vX.Y.Z` comment preserves readability, and Dependabot updates the
# SHA and the comment together.
#
# Reference: GitHub Actions security hardening guide,
# "Using third-party actions":
# https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#using-third-party-actions

name: build-and-push

on:
  push:
    branches: [main, stage]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Type-checking runs in parallel with the image build instead of inside
  # the Dockerfile. It still gates the PR (it's a separate required check),
  # but it doesn't add to the image's critical path. Saves ~8s on every
  # image build and also surfaces TS errors as a distinct status.
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Map the trigger to an environment + tag prefix in ONE place.
      #   main  -> live   stage -> stage   PR -> pr-<number>
      - name: Resolve deploy target
        id: target
        run: |
          case "${{ github.ref }}" in
            refs/heads/main)  env=live  ;;
            refs/heads/stage) env=stage ;;
            *)                env=pr-${{ github.event.number }} ;;
          esac
          echo "env=$env" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Immutable per-commit tag + a moving alias, both prefixed by the target.
      #   e.g. live-sha-<sha> + live   |   pr-42-sha-<sha> + pr-42
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=${{ steps.target.outputs.env }}-sha-
            type=raw,value=${{ steps.target.outputs.env }}

      - name: Build and push
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=min exports only the final image's layers (smaller and
          # faster than mode=max). When the source hasn't changed, the
          # whole RUN-build layer hits and the build is near-instant.
          # When source changes, the build re-runs from scratch — we
          # don't try to persist intra-build caches across runs, since
          # doing so reliably requires actions/cache + buildkit-cache-
          # dance, which is more moving parts than this project warrants.
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: true
          sbom: true
